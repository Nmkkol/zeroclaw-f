name: Build ZeroClaw with WeChat

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build via official install.sh
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          source $HOME/.cargo/env
          curl -fsSL https://raw.githubusercontent.com/zeroclaw-labs/zeroclaw/master/install.sh | sh -s -- --source --features agent-runtime,gateway,channel-wechat

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: zeroclaw-wechat-linux-amd64
          path: /home/runner/.cargo/bin/zeroclaw
